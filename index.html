<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Desk">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FOMO Desk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand">FOMO Desk</div>
    <div id="status" class="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-label">Waiting</span>
    </div>
  </header>
  <main class="card" id="app">
    <div id="mode" class="mode">—</div>
    <div id="balance" class="balance">—</div>
    <div id="updated" class="meta">Waiting for the first tick</div>
    <div id="msg" class="msg hidden"></div>
    <div id="note" class="note hidden"></div>
  </main>
  <script src="relay_base.js"></script>
  <script src="app.js"></script>
</body>
</html>
